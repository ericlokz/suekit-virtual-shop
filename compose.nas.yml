services:
  api:
    image: ougaone-growth-showcase-api:${SHOWCASE_TAG:-local}
    build:
      context: .
      dockerfile: analytics-service/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      PLAN_API_URL: ${PLAN_API_URL:?Set the OUGAONE plan API URL}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-ericlokz/OUGAONE}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      UMAMI_BASE_URL: ${UMAMI_BASE_URL:-}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      UMAMI_API_KEY: ${UMAMI_API_KEY:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  web:
    image: ougaone-growth-showcase-web:${SHOWCASE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        UMAMI_SCRIPT_URL: ${UMAMI_SCRIPT_URL:-}
        UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SHOWCASE_PORT:?Set SHOWCASE_PORT}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  umami-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:?Set UMAMI_DB_PASSWORD}
    volumes:
      - umami-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  umami:
    image: ougaone-growth-umami:v3.4.0-path
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:?Set UMAMI_DB_PASSWORD}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?Set UMAMI_APP_SECRET}
      TWO_FACTOR_ENCRYPTION_KEY: ${UMAMI_TWO_FACTOR_ENCRYPTION_KEY:?Set UMAMI_TWO_FACTOR_ENCRYPTION_KEY}
      DISABLE_TELEMETRY: "1"
      DISABLE_UPDATES: "1"
    depends_on:
      umami-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:4176:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/analytics/api/heartbeat >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  frpc:
    image: ougaone-frpc:0.71.0
    environment:
      FRP_SERVER_ADDR: ${FRP_SERVER_ADDR:?Set FRP_SERVER_ADDR}
      FRP_TOKEN: ${FRP_TOKEN:?Set FRP_TOKEN}
      FRP_REMOTE_PORT: ${FRP_REMOTE_PORT:-13182}
      FRP_ANALYTICS_REMOTE_PORT: ${FRP_ANALYTICS_REMOTE_PORT:-13183}
    volumes:
      - ./deploy/frpc-growth.toml:/etc/frp/frpc.toml:ro
      - /volume1/docker/ougaone-frpc/server.crt:/etc/frp/server.crt:ro
    depends_on:
      web:
        condition: service_healthy
      umami:
        condition: service_healthy
    restart: unless-stopped

volumes:
  umami-data:
