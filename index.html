<style>.metrics-panel {
  --mp-paper: #f5efe2; --mp-card: #fffdf8; --mp-ink: #2b2520; --mp-muted: #6b6258;
  --mp-faint: #948a7c; --mp-line: #e7ddca; --mp-accent: #9d6551; --mp-soft: #9d65511a;
  color: var(--mp-ink); background: var(--mp-paper); padding: 26px 24px 20px; min-width: 0;
  overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--mp-line) transparent;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
}
.metrics-panel * { box-sizing: border-box; }
.metrics-panel p, .metrics-panel h2, .metrics-panel h3 { margin: 0; }
.project-header { padding-bottom: 22px; border-bottom: 1px solid var(--mp-line); }
.project-eyebrow, .project-section-label { color: var(--mp-accent); font-size: 10px; font-weight: 700; letter-spacing: .14em; }
.project-header h2 { margin-top: 9px; font-size: 27px; font-weight: 600; letter-spacing: .03em; }
.project-intro, .project-updated, .project-note { color: var(--mp-muted); font-size: 11px; line-height: 1.7; }
.project-intro { margin-top: 8px !important; }
.project-updated { margin-top: 9px !important; color: var(--mp-faint); }
.project-section-label { margin: 22px 0 10px !important; }
.project-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--mp-line); border-radius: 11px; background: var(--mp-card); }
.project-stat { min-width: 0; padding: 13px 12px; }
.project-stat + .project-stat { border-left: 1px solid var(--mp-line); }
.project-stat-label, .project-stat-note { color: var(--mp-muted); font-size: 10px; line-height: 1.45; }
.metrics-panel .project-stat-value { display: block; margin: 7px 0 5px; color: var(--mp-accent); font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; }
.project-stat-note { color: var(--mp-faint); font-size: 9px; }
.project-section { padding: 19px 0 17px; border-bottom: 1px solid var(--mp-line); }
.project-section h3 { margin-bottom: 11px; font-size: 13px; font-weight: 650; }
.project-group { display: flex; flex-direction: column; gap: 4px; padding: 9px 0; border-bottom: 1px solid var(--mp-line); font-size: 11px; }
.project-group-count { color: var(--mp-muted); font-size: 10px; line-height: 1.5; }
.project-note { margin-top: 8px !important; color: var(--mp-faint); font-size: 10px; }
.project-stats--compact { margin-top: 11px; }
.project-stats--compact .project-stat { padding: 11px 9px; }
.project-stats--compact .project-stat-value { font-size: 19px; }
.project-code-diff { margin-top: 13px !important; font-size: 11px; font-weight: 600; color: var(--mp-accent); font-variant-numeric: tabular-nums; }
.project-chart { margin-top: 12px; padding: 10px 11px 7px; border: 1px solid var(--mp-line); border-radius: 9px; background: var(--mp-card); color: var(--mp-accent); }
.project-chart svg { width: 100%; display: block; overflow: visible; }
.project-chart-labels { display: flex; justify-content: space-between; color: var(--mp-faint); font-size: 9px; }
.project-empty, .project-notice { margin-top: 12px !important; padding: 12px; border: 1px dashed var(--mp-line); border-radius: 8px; background: var(--mp-card); color: var(--mp-muted); font-size: 10px; line-height: 1.6; }
.project-notice { color: #8b5545; background: var(--mp-soft); }
.project-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 17px; color: var(--mp-faint); font-size: 10px; }
.project-footer a { color: var(--mp-accent); text-decoration: none; }
.project-footer a:hover { text-decoration: underline; }
.project-footer a:focus-visible { outline: 2px solid var(--mp-accent); outline-offset: 3px; }
@media (max-width: 410px) { .metrics-panel { padding: 20px 16px 16px; } .project-stat { padding: 11px 8px; } .metrics-panel .project-stat-value { font-size: 21px; } .project-stats--compact .project-stat-value { font-size: 17px; } }

.project-dashboard{--ui-bg:#ece3d1;--ui-card:#fffdf8;--ui-card2:#f5efe2;--ui-ink:#2b2520;--ui-muted:#5b5349;--ui-faint:#9c9384;--ui-line:#e7ddca;--ui-accent:#c9694c;--ui-accent-text:#fffdf8}
body,html[data-mode="day"][data-season="winter"] body,html[data-mode="day"][data-season="autumn"] body{background:radial-gradient(ellipse at 48% 42%,#f5efe2 0%,#ece3d1 68%,#dfd2bd 100%)}
html[data-mode="night"] body{background:radial-gradient(ellipse at 48% 42%,#383029 0%,#302923 58%,#262019 100%)}
html[data-mode="night"] .project-dashboard{--ui-bg:#262019;--ui-card:#3a332d;--ui-card2:#302b27;--ui-ink:#fff5e7;--ui-muted:#cbbfac;--ui-faint:#b0a394;--ui-line:#49413a;--ui-accent:#c9694c;--ui-accent-text:#fff5e7}
.switch-group{border-color:var(--ui-line);background:#f5efe2e8;box-shadow:0 8px 30px #5b53491c}
.switch-group button{color:var(--ui-muted)}
.switch-group button:hover{background:#e8c5b255}
.switch-group button[aria-pressed="true"]{background:var(--ui-accent);color:var(--ui-accent-text);box-shadow:0 3px 9px #c9694c33}
.switch-group button:focus-visible{outline-color:var(--ui-accent)}
html[data-mode="night"] .switch-group{border-color:var(--ui-line);background:#302b27e8;box-shadow:0 8px 30px #0003}
html[data-mode="night"] .switch-group button{color:var(--ui-muted)}
html[data-mode="night"] .switch-group button:hover{background:#5c473e}
html[data-mode="night"] .switch-group button[aria-pressed="true"]{background:var(--ui-accent);color:var(--ui-accent-text);box-shadow:0 3px 9px #0003}
.project-dashboard{display:grid;grid-template-columns:minmax(0,1fr) clamp(320px,32vw,392px);grid-template-rows:minmax(0,1fr);gap:18px;width:100%;height:100dvh;padding:24px 28px 24px 10px}
.project-dashboard .metrics-panel{min-height:0;border-radius:20px;border:1px solid var(--ui-line);box-shadow:0 12px 36px #5b534916}
.model-stage{position:relative;min-width:0;min-height:0;overflow:hidden}
.scene-heading{position:absolute;left:30px;top:14px;z-index:3;pointer-events:none;color:var(--ui-ink)}
.scene-heading p{margin:0 0 8px;font-size:10px;font-weight:600;letter-spacing:.2em;color:var(--ui-faint)}
.scene-heading h1{margin:0;font-size:21px;font-weight:500;letter-spacing:.04em}
.scene-heading .scene-description{margin:10px 0 0;font-size:11px;font-weight:400;letter-spacing:.04em;color:var(--ui-muted)}
.project-repo-link{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border:1px solid var(--ui-line);border-radius:999px;background:color-mix(in srgb,var(--ui-card2) 72%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 4px 18px #5b534914;color:var(--ui-accent);font-size:12px;font-weight:600;letter-spacing:.04em;text-decoration:none;transition:opacity .2s}
.project-repo-link:hover{opacity:.75}
.project-repo-link:focus-visible{outline:2px solid var(--ui-accent);outline-offset:3px}
.model-stage #world{position:absolute;inset:0;width:100%;height:100%}
.model-toolbar{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);display:flex;flex-direction:column;align-items:center;gap:14px;z-index:5}
.model-toolbar .switches{position:static;transform:none;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px}
.model-toolbar .switch-group{padding:4px;border-radius:14px}
.model-toolbar .switch-group button{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;height:38px;min-width:42px;padding:0 12px;border-radius:10px;font-size:12px;letter-spacing:.02em}
.model-toolbar .time button{min-width:76px;padding:0 12px}
.model-toolbar .symbol{font-size:15px;margin-right:5px}
html[data-mode="night"] .project-dashboard .metrics-panel{border-color:var(--ui-line);box-shadow:0 12px 36px #0003}
@media(max-width:800px){
  html,body{height:auto;min-height:100%;overflow:auto}
  .project-dashboard{display:flex;flex-direction:column;height:auto;min-height:100dvh;gap:18px;padding:14px}
  .model-stage{height:74dvh;min-height:470px;max-height:720px;flex:none}
  .scene-heading{left:16px;top:14px}
  .scene-heading h1{font-size:19px}
  .model-toolbar{bottom:8px;gap:12px}
  .model-toolbar .switches{flex-direction:row}
  .project-dashboard .metrics-panel{width:100%;max-height:none;overflow:visible}
}
@media(max-width:410px){
  .scene-heading .scene-description{font-size:10px}
  .model-toolbar .switches{gap:7px;flex-direction:column}
  .model-toolbar .switch-group button{height:36px;min-width:48px}
  .model-toolbar .time button{min-width:94px}
  .model-stage{height:72dvh;min-height:470px}
}
@media(min-width:801px) and (max-height:620px){
  .project-dashboard{padding-top:14px;padding-bottom:14px}
  .scene-heading{top:3px}
  .scene-heading .scene-description{display:none}
  .model-toolbar{bottom:0;gap:8px}
}
